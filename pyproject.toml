[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex"
version = "0.1.0"
description = "Language-agnostic PR test selection: static import graphs + Laya semantic fallback."
requires-python = ">=3.9"
dependencies = [
    "laya==0.3.20",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
